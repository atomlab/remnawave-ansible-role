services:
  remnawave-db:
    image: postgres:17.6
    container_name: 'remnawave-db'
    hostname: remnawave-db
    network_mode: host
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - "{{ remna_workdir }}/db/pg/data:/var/lib/postgresql/data"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  remnawave:
    image: remnawave/backend:{{ remna_release }}
    container_name: 'remnawave'
    hostname: remnawave
    restart: always
    network_mode: host
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      - FRONT_END_DOMAIN={{ remna_domain }}
      - SUB_PUBLIC_DOMAIN={{ remna_sub_domain }}
      - CUSTOM_SUB_PREFIX={{ reman_custom_sub_prefix }}
      - APP_PORT=3000
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${METRICS_PORT:-3001}/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      remnawave-db:
        condition: service_healthy
      remnawave-redis:
        condition: service_healthy

  remnawave-redis:
    image: valkey/valkey:8.1-alpine
    container_name: remnawave-redis
    hostname: remnawave-redis
    restart: always
    network_mode: host
    volumes:
      - "{{ remna_workdir }}/db/redis/data:/data"
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 3

  xray-ui:
    container_name: xray-ui
    hostname: xray-ui
    restart: always
    network_mode: host
    build:
      context: ./xray-ui
      dockerfile: Dockerfile
      network: host
      args:
        ANGIE_IMAGE: docker.angie.software/angie:1.10.1-debian
        XRAY_UI_RELEASE: "{{ remna_xray_ui_release }}"
    image: local/xray-config-ui:{{ remna_xray_ui_release }}
    volumes:
      - "{{ remna_workdir }}/xray-ui/angie.conf:/etc/angie/angie.conf:ro"

  proxy:
    container_name: proxy
    image: docker.angie.software/angie:1.10.1-debian
    network_mode: host
    ports:
      - 443:443
      - 80:80
    command: ["angie", "-g", "daemon off;"]
    volumes:
      - "{{ remna_workdir }}/proxy/angie.conf:/etc/angie/angie.conf:ro"
      - "{{ remna_workdir }}/proxy/logs:/var/log/angie"
      - "{{ remna_workdir }}/proxy/acme:/var/lib/angie/acme"
