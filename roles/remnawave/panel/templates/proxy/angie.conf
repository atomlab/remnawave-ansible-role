user  root;
worker_processes  auto;
worker_rlimit_nofile 16384;

pid        /run/angie.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format extended '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" rt="$request_time" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'h="$host" sn="$server_name" ru="$request_uri" u="$uri" '
                        'ucs="$upstream_cache_status" ua="$upstream_addr" us="$upstream_status" '
                        'uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log  /var/log/angie/access.log  extended;
    error_log  /var/log/angie/error.log debug;


    # General SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:512k;
    ssl_session_tickets off;
    ssl_stapling           on;
    ssl_stapling_verify    on;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;


    upstream remnawave {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    {%if remna_sub_same_host_enabled %}

    upstream remnawave-subscription-page {
        server {{ remna_sub_upstream }};
    }

    {%endif%}

    # Connection header for WebSocket reverse proxy
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220 valid=10s ipv6=off; 
    resolver_timeout 2s;

    acme_client acme_le https://acme-v02.api.letsencrypt.org/directory;

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_reject_handshake on;
    }

    server {
        listen 80;
        return 444; # https://angie.software/angie/docs/configuration/acme/#http
    }

    server {
        server_name {{ remna_domain }};

        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        acme acme_le;

        ssl_certificate $acme_cert_acme_le;
        ssl_certificate_key $acme_cert_key_acme_le;

        # Xray Config UI Editor (статика из контейнера xray-ui)
        location = /xray-ui { return 301 /xray-ui/; }

        location /xray-ui/ {
            proxy_http_version 1.1;
            # замыкающий "/" срезает префикс /xray-ui — внутри контейнера
            # статика лежит в корне и собрана с --base=/xray-ui/
            proxy_pass http://127.0.0.1:8090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_http_version 1.1;
            proxy_pass http://remnawave;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

    }

    {%if remna_sub_same_host_enabled %}

    server {
        server_name {{ remna_sub_domain }};

        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        acme acme_le;

        ssl_certificate $acme_cert_acme_le;
        ssl_certificate_key $acme_cert_key_acme_le;

        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=15552000" always;

        location / {
            proxy_http_version 1.1;
            proxy_pass http://remnawave-subscription-page;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    {%endif%}



}
