# Минимальный angie для раздачи статики xray-config-ui-editor.
# Контейнер в network_mode: host, наружу трафик идёт через основной proxy.
worker_processes  auto;
error_log  /var/log/angie/error.log warn;
pid        /run/angie.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    tcp_nopush    on;

    server {
        listen 127.0.0.1:8090;

        root  /var/www/xray-ui;
        index index.html;

        # Хэшированные ассеты vite — кэшируем навсегда
        location /assets/ {
            try_files $uri =404;
            expires max;
            add_header Cache-Control "public, immutable";
        }

        # Service worker, манифест и сам index.html — всегда свежие
        location = /index.html           { add_header Cache-Control "no-cache"; }
        location = /sw.js                { add_header Cache-Control "no-cache"; }
        location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
        location = /registerSW.js        { add_header Cache-Control "no-cache"; }

        # SPA-fallback: всё остальное — на index.html
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
